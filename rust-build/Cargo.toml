[workspace]
resolver = "2"
members = [
    "v1-http-echo",
    "v2-json-body",
    "v3-jsonrpc",
    "v4-errors",
    "v5-timeouts",
]

[workspace.dependencies]
axum = "0.8"
tokio = { version = "1", features = ["full"]}
reqwest = { version = "0.12", features = ["json"] }
futures-util = "=0.3.31"
serde = { version = "1", features = ["derive"] }
serde_json = "1"